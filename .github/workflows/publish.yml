name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@e9caf140667208d00759ae23a31fceafbdac6507
    with:
      source: illustrations-009
      tooling-ref: e9caf140667208d00759ae23a31fceafbdac6507
      check-authentication: ${{ inputs.check-authentication }}
