name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@5963277e4d977ca46944cfb5ab8812b7fe25c517
    with:
      source: illustrations-009
      tooling-ref: 5963277e4d977ca46944cfb5ab8812b7fe25c517
      check-authentication: ${{ inputs.check-authentication }}
